        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <span>Настройки</span>
                <button class="sidebar-close-btn" id="sidebarCloseBtn">&times;</button>
            </div>
            <div class="sidebar-content">
                <!-- Тема -->
                <div class="sidebar-option">
                    <label class="sidebar-option-label" id="sidebarThemeLabel">Тема</label>
                    <div class="toggle-group sidebar-toggle">
                        <span><i class="fa-solid fa-sun"></i></span>
                        <label class="toggle-switch" title="Переключить тему">
                            <input type="checkbox" id="sidebarThemeToggle">
                            <span class="toggle-slider"></span>
                        </label>
                        <span><i class="fa-solid fa-moon"></i></span>
                    </div>
                </div>
                <!-- Тест / Обучение -->
                <div class="sidebar-option">
                    <label class="sidebar-option-label" id="sidebarTestModeLabel">Режим обучения</label>
                    <div class="toggle-group sidebar-toggle">
                        <span>Учить</span>
                        <label class="toggle-switch" title="Режим теста">
                            <input type="checkbox" id="sidebarTestModeToggle">
                            <span class="toggle-slider"></span>
                        </label>
                        <span>Тест</span>
                    </div>
                </div>
                <!-- Только верные -->
                <div class="sidebar-option">
                    <label class="sidebar-option-label">Только верные ответы</label>
                    <div class="toggle-group sidebar-toggle">
                        <span>Все</span>
                        <label class="toggle-switch" title="Показать только правильные ответы">
                            <input type="checkbox" id="sidebarCorrectOnlyToggle">
                            <span class="toggle-slider"></span>
                        </label>
                        <span><i class="fa-solid fa-check"></i></span>
                    </div>
                </div>
                <!-- Выдержки -->
                <div class="sidebar-option">
                    <label class="sidebar-option-label">Выдержки из нормативки</label>
                    <div class="toggle-group sidebar-toggle">
                        <span><i class="fa-solid fa-book"></i></span>
                        <label class="toggle-switch" title="Показать выдержки из нормативки">
                            <input type="checkbox" id="sidebarCitationsToggle">
                            <span class="toggle-slider"></span>
                        </label>
                        <span><i class="fa-solid fa-quote-right"></i></span>
                    </div>
                </div>
                <!-- Группа тестовых опций (скрыта в обучении) -->
                <div id="testOptionsGroup" style="display: none;">
                    <!-- <hr> -->
                    <!-- Звук -->
                    <div class="sidebar-option">
                        <label class="sidebar-option-label">Звук</label>
                        <div class="toggle-group sidebar-toggle">
                            <span><i class="fa-solid fa-volume-xmark"></i></span>
                            <label class="toggle-switch" title="Звук">
                                <input type="checkbox" id="sidebarSoundToggle">
                                <span class="toggle-slider"></span>
                            </label>
                            <span><i class="fa-solid fa-volume-high"></i></span>
                        </div>
                    </div>
                    <div class="sidebar-option">
                        <label class="sidebar-option-label">Мелодия</label>
                        <div class="toggle-group sidebar-toggle">
                            <span>1</span>
                            <label class="toggle-switch" title="Переключить набор звуков">
                                <input type="checkbox" id="sidebarSoundSetToggle">
                                <span class="toggle-slider"></span>
                            </label>
                            <span>2</span>
                        </div>
                    </div>
                    <!-- Перемешать -->
                    <div class="sidebar-option">
                        <label class="sidebar-option-label">Перемешать вопросы и ответы</label>
                        <div class="toggle-group sidebar-toggle">
                            <span><i class="fa-solid fa-list-ol"></i></span>
                            <label class="toggle-switch" title="Перемешать">
                                <input type="checkbox" id="sidebarShuffleToggle" checked>
                                <span class="toggle-slider"></span>
                            </label>
                            <span><i class="fa-solid fa-shuffle"></i></span>
                        </div>
                    </div>
                    <!-- Сетка -->
                    <div class="sidebar-option">
                        <label class="sidebar-option-label">Сетка вопросов</label>
                        <div class="toggle-group sidebar-toggle">
                            <span><i class="fa-solid fa-bars"></i></span>
                            <label class="toggle-switch" title="Сетка вопросов">
                                <input type="checkbox" id="sidebarGridToggle">
                                <span class="toggle-slider"></span>
                            </label>
                            <span><i class="fa-solid fa-border-all"></i></span>
                        </div>
                    </div>
                    <!-- Автопереход -->
                    <div class="sidebar-option">
                        <label class="sidebar-option-label">Автопереход к следующему вопросу</label>
                        <div class="toggle-group sidebar-toggle">
                            <span><i class="fa-solid fa-pause"></i></span>
                            <label class="toggle-switch" title="Автопереход">
                                <input type="checkbox" id="sidebarAutoAdvanceToggle">
                                <span class="toggle-slider"></span>
                            </label>
                            <span><i class="fa-solid fa-forward"></i></span>
                        </div>
                    </div>
                    <!-- Таймер билета -->
                    <div class="sidebar-option">
                        <label class="sidebar-option-label">Таймер на билет (10 вопросов)</label>
                        <div class="toggle-group sidebar-toggle">
                            <span>10 мин</span>
                            <label class="toggle-switch" title="Выбор таймера">
                                <input type="checkbox" id="sidebarTimerToggle">
                                <span class="toggle-slider"></span>
                            </label>
                            <span>20 мин</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Оверлей (мобильные) -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <!-- Основной контент -->
        <main class="main-container">
            <!-- Ticket Navigation -->
            <div class="ticket-nav-div">
                <div class="ticket-nav">
                    <span class="nav-label">Билет</span>
                    <select class="ticket-select" id="ticketSelect"></select>
                    <div class="ticket-pagination" id="ticketPagination"></div>
                </div>

                <!-- Ticket Header -->
                <div class="ticket-header">
                    <h2 class="ticket-title" id="ticketTitle">Билет 1</h2>
                    <span class="ticket-badge" id="questionCount">10 вопросов</span>
                </div>
            </div>
            <!-- Верхний блок управления тестом -->
            <div class="test-controls test-controls-top" id="testControlsTop" style="display: none;">
                <div class="test-top-row">
                    <button class="btn btn-sm" id="nextTicketBtn" title="Случайный билет">
                        <i class="fa-solid fa-shuffle"></i> Случайный билет
                    </button>
                    <button class="btn btn-sm" id="randomQuestionsBtn" title="Случайные вопросы из всех билетов">
                        <i class="fa-solid fa-dice-d6"></i> Случайные вопросы
                    </button>
                </div>
                <div class="test-top-row">    
                    <div class="test-top-row-time">
                        <div class="timer-display" id="timerDisplay">20:00</div>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
                        </div>
                    </div>
                    <span class="test-progress" id="questionProgress">1 / 10</span>
                    <button class="btn btn-sm btn-accent" id="finishTestBtn" style="display:none;">
                        <i class="fa-solid fa-flag-checkered"></i> Завершить / Результаты
                    </button>
                </div>
            </div>

            <!-- Сетка вопросов -->
            <div id="questionGrid" class="question-grid" style="display:none;"></div>

            <!-- Questions -->
            <div class="questions-list" id="questionsList"></div>

            <!-- Нижний блок управления тестом -->
            <div class="test-controls test-controls-bottom" id="testControlsBottom" style="display: none;">
                <button class="btn btn-sm" id="prevQuestionBtn">
                    <i class="fa-solid fa-chevron-left"></i> Предыдущий вопрос
                </button>
                <button class="btn btn-sm" id="nextQuestionBtn">
                    Следующий вопрос <i class="fa-solid fa-chevron-right"></i>
                </button>
                <button class="btn btn-sm btn-accent" id="finishTestBtnBottom" style="display:none;">
                    <i class="fa-solid fa-flag-checkered"></i> Завершить / Результаты
                </button>
            </div>

            <!-- Результаты теста -->
            <div class="test-results" id="testResults" style="display: none;"></div>

            <!-- Empty state for search -->
            <div class="empty-state" id="emptyState" style="display:none;">
                <div class="empty-icon">📭</div>
                <p>Ничего не найдено</p>
                <small>Попробуйте изменить поисковый запрос</small>
            </div>
            <!-- Модальное окно случайных вопросов -->
            <div class="modal-overlay" id="randomModal" style="display:none;">
            <div class="modal">
                <div class="modal-header">
                <h3>Случайные вопросы</h3>
                <button class="modal-close-btn" id="modalCloseBtn">&times;</button>
                </div>
                <div class="modal-body">
                <label for="randomQuestionCount">Количество вопросов:</label>
                <select id="randomQuestionCount" class="modal-select">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="30">30</option>
                    <option value="40">40</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="all">Все</option>
                </select>
                <div class="modal-actions">
                    <button class="btn btn-accent" id="modalStartBtn">Начать тест</button>
                    <button class="btn" id="modalCancelBtn">Отмена</button>
                </div>
                </div>
            </div>
            </div>
        </main>
    </div>

    <!-- Кнопка "Наверх" -->
    <button id="scrollToTopBtn" title="Наверх">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <!-- Аудио -->
     <!-- Контейнер для анимации фейерверка -->
    <div id="fireworksContainer"></div>
    <audio id="soundCorrect" preload="auto" src="{{ url_for('static', filename='sounds/correct.mp3') }}"></audio>
    <audio id="soundWrong" preload="auto" src="{{ url_for('static', filename='sounds/wrong.mp3') }}"></audio>
    <audio id="soundCorrect" preload="auto" src="{{ url_for('static', filename='sounds/correct_1.mp3') }}"></audio>
    <audio id="soundWrong" preload="auto" src="{{ url_for('static', filename='sounds/wrong_1.mp3') }}"></audio>
    <audio id="soundVictory" preload="auto" src="{{ url_for('static', filename='sounds/victory.mp3') }}"></audio>
    <audio id="soundVictory" preload="auto" src="{{ url_for('static', filename='sounds/victory_1.mp3') }}"></audio>
    <script>
        // Пути к двум наборам звуков
        window.SOUND_CORRECT_1 = "{{ url_for('static', filename='sounds/correct_1.mp3') }}";
        window.SOUND_WRONG_1   = "{{ url_for('static', filename='sounds/wrong_1.mp3') }}";
        window.SOUND_CORRECT_2 = "{{ url_for('static', filename='sounds/correct.mp3') }}";
        window.SOUND_WRONG_2   = "{{ url_for('static', filename='sounds/wrong.mp3') }}";
        window.SOUND_VICTORY_1 = "{{ url_for('static', filename='sounds/victory.mp3') }}";
        window.SOUND_VICTORY_2 = "{{ url_for('static', filename='sounds/victory_1.mp3') }}";
    </script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        // Передача данных из Flask в JavaScript
        window.TICKETS_DATA = {{ tickets_json|safe }};

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
